name: Build Paper JAR

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Paper/Bukkit JAR
        run: ./gradlew :bukkit:loader:shadowJar

      - name: Upload Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckPerms-Paper
          path: bukkit/loader/build/libs/LuckPerms-Bukkit-*.jar
